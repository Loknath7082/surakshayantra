language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "development"

  path_filters:
    - "!context/**"
    - "!**/*.md"
    - "!package-lock.json"
    - "!public/**"

chat:
  auto_reply: true

tone_instructions: "Be concise and technical. Focus on correctness, security, and adherence to the context files in context/."
